# Demo: `docker compose up --build` boots the game (memory store) on 8080 / 4001.
# Postgres is optional. Empty DATABASE_URL (the game service default) selects
# the in-memory AccountStore (D-014).
#
# Persistent accounts:
#   set game.environment.DATABASE_URL to
#   postgres://yeomyeong:yeomyeong@postgres:5432/yeomyeong?sslmode=disable
#   and add depends_on: { postgres: { condition: service_healthy } }.
#
# Local go run (also memory unless DATABASE_URL is set):
#   go run ./cmd/server
#   open http://localhost:8080

services:
  game:
    build: .
    ports:
      - "8080:8080"
      - "4001:4001"
    environment:
      YEOMYEONG_TELNET_ADDR: ":4001"
      YEOMYEONG_WS_ADDR: ":8080"
      DATABASE_URL: ""

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yeomyeong
      POSTGRES_PASSWORD: yeomyeong
      POSTGRES_DB: yeomyeong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yeomyeong -d yeomyeong"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
