name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Go checks
        run: |
          set -euo pipefail
          if [ ! -f go.mod ]; then
            echo "No go.mod yet — skipping go build/vet/test (pre-engine foundation)."
            exit 0
          fi
          go build ./...
          go vet ./...
          go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: hashFiles('go.mod') != '' && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: golangci-lint
        if: hashFiles('go.mod') != ''
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
