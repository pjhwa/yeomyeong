# M2 practice set (SKILL-TABLE.md, D-035, D-040). Fourteen skills. 아무개 last.
# verbs are what the player types. gain/miss are the room, not a number.
skills:
  - id: unarmed
    name: 주먹
    group: combat
    stat: str
    practice_flag: yard
    verbs: [주먹질]
    gain:
      - 주먹이 제대로 나갔다. 손마디가 뜨겁다.
      - 숨이 차지만, 자세가 잡힌 느낌이다.
    miss:
      - 자세가 흐트러졌다. 먼지만 난다.
  - id: sword
    name: 칼
    group: combat
    stat: str
    practice_flag: yard
    practice_item: wooden-sword
    verbs: [휘두르다, 칼질]
    gain:
      - 목검이 바람 소리를 냈다. 손바닥에 나무 결이 남는다.
      - 칼끝이 조금 더 낮아졌다. 이마에 땀이 난다.
    miss:
      - 허공만 쳤다. 손목이 저리다.
  - id: bow
    name: 활
    group: combat
    stat: dex
    practice_flag: yard
    verbs: [당기다, 쏘다]
    gain:
      - 시위가 손가락을 아프게 눌렀다. 짚 냄새가 난다.
      - 화살이 짧게 울렸다. 어깨가 한 번 떨린다.
    miss:
      - 시위만 울렸다. 화살은 땅에 떨어졌다.
  - id: dodge
    name: 피하기
    group: combat
    stat: dex
    practice_flag: yard
    verbs: [피하다, 비키다]
    gain:
      - 몸이 옆으로 빠졌다. 모래가 발바닥에 묻는다.
      - 어깨로 바람을 스쳤다. 숨이 짧다.
    miss:
      - 발이 꼬였다. 먼지만 난다.
  - id: guard
    name: 막기
    group: combat
    stat: vit
    practice_flag: yard
    verbs: [막다]
    gain:
      - 팔이 묵직하다. 흙냄새와 땀냄새가 난다.
      - 자세를 낮췄다. 발이 땅을 짚는다.
    miss:
      - 팔이 늦었다. 숨만 가쁘다.
  - id: firstaid
    name: 응급처치
    group: combat
    stat: sense
    practice_flag: clinic
    practice_item: bandage
    verbs: [감다]
    gain:
      - 붕대가 피부에 붙는다. 풀 냄새가 손에 남는다.
      - 매듭이 작아졌다. 손끝이 따뜻하다.
    miss:
      - 붕대가 풀렸다. 풀만 끈적하다.
  - id: smith
    name: 대장
    group: craft
    stat: str
    practice_flag: forge
    practice_item: hammer
    verbs: [두드리다, 망치질]
    gain:
      - 쇠가 조금 얇아졌다. 손바닥이 뜨겁다.
      - 모루가 낮게 울렸다. 불똥이 앞치마를 스친다.
      - 망치 자루가 땀에 젖어 미끄럽다. 쇠 냄새가 난다.
    miss:
      - 빗나갔다. 모루만 울린다.
      - 불이 꺼진 자리만 차갑다. 쇠는 그대로다.
  - id: cook
    name: 요리
    group: craft
    stat: sense
    practice_flag: kitchen
    practice_item: kitchen-knife
    verbs: [썰다, 볶다]
    gain:
      - 칼이 도마를 쳤다. 참기름 냄새가 손에 묻는다.
      - 간이 혀끝에 남는다. 김이 얼굴에 닿는다.
    miss:
      - 재료가 버티지 않는다. 도마만 젖었다.
  - id: print
    name: 인쇄
    group: craft
    stat: dex
    practice_flag: press
    practice_item: composing-stick
    verbs: [찍다]
    gain:
      - 활자가 홈에 들어갔다. 잉크가 손톱 밑에 묻는다.
      - 종이가 기계에 물렸다. 납 냄새가 난다.
    miss:
      - 활자가 빗나갔다. 종이만 찢어졌다.
  - id: remedy
    name: 약
    group: craft
    stat: sense
    practice_flag: clinic
    verbs: [달이다]
    gain:
      - 약탕기가 낮게 끓는다. 쓴맛이 목구멍에 남는다.
      - 뿌리가 손에서 부서진다. 손등이 따뜻하다.
    miss:
      - 불이 세다. 쓴내만 타고 약은 안 된다.
  - id: haggle
    name: 흥정
    group: social
    stat: fame
    practice_flag: market
    verbs: [흥정하다, 깎다]
    gain:
      - 주인이 눈을 가늘게 뜬다. 기름종이 냄새가 난다.
      - 값이 조금 내려갈 것 같다. 목이 쉰다.
    miss:
      - 주인이 고개를 젓는다. 값은 그대로다.
  - id: speech
    name: 말솜씨
    group: social
    stat: wit
    practice_flag: salon
    verbs: [이야기하다, 말걸다]
    gain:
      - 맞은편 손님이 잔을 멈추고 듣는다. 보리차 김이 올라온다.
      - 창가 접시가 살짝 울렸다. 누가 짧게 웃는다.
      - 목소리가 낮아졌다. 라디오 소리가 조금 늦게 들린다.
    miss:
      - 말이 김에 묻혀 안 들린다.
      - 맞은편은 잔만 본다. 대답이 없다.
  - id: stealth
    name: 숨기
    group: social
    stat: dex
    practice_flag: dark
    verbs: [숨다]
    gain:
      - 발소리가 흙에 묻혔다. 그늘이 어깨를 가린다.
      - 숨이 짧아졌다. 담장에서 습기가 느껴진다.
    miss:
      - 자갈이 울렸다. 그늘이 걷혔다.
  - id: lockpick
    name: 자물쇠
    group: social
    stat: dex
    practice_item: lockpick
    verbs: [따다]
    gain:
      - 송곳이 홈을 더듬는다. 쇠가 차갑다.
      - 걸쇠가 작게 울렸다. 손끝에 기름이 묻는다.
    miss:
      - 송곳이 미끄러졌다. 쇠만 차갑다.

# M3 slice (D-042). One gather skill; split 채광/약초 later.
  - id: forage
    name: 채집
    group: gather
    stat: sense
    verbs: [캐다, 줍다]
    gain:
      - 손에 흙이 묻는다. 풀 냄새가 난다.
      - 뿌리가 뽑혔다. 손끝이 시리다.
    miss:
      - 흙만 묻었다. 가진 것은 없다.
      - 손이 빗나갔다. 풀만 꺾였다.

titles:
  - id: smith-local
    require: {smith: 15}
    title: {ko: 달빛골의 대장장이}
    announce: 사람들이 이제 달빛골의 대장장이라고 불러요.
  - id: speaker
    require: {speech: 15}
    title: {ko: 말 잘하는 사람}
    announce: 다방에서 이제 말 잘하는 사람이라고 불러요.
  - id: nailer
    require: {smith: 8}
    title: {ko: 못 벼리는 사람}
    announce: 사람들이 이제 못 벼리는 사람이라고 불러요.
  - id: peddler
    require: {haggle: 8}
    title: {ko: 보부상}
    announce: 사람들이 이제 보부상이라고 불러요.
  - id: forager
    require: {forage: 8}
    title: {ko: 달빛골의 채집꾼}
    announce: 사람들이 이제 달빛골의 채집꾼이라고 불러요.
  - id: nobody
    require: {}
    title: {ko: 아무개}
