# Scripted T0 NPCs. Dialogue is YAML only — not LLM.

- id: cheongram
  name:
    ko: 청람 선생
  room: dalbitgol:school
  aliases: [청람, 선생]
  look:
    ko: >
      낡은 코트 소매 끝에 잉크가 배어 있고, 손가락에서도 먹 냄새가 난다.
      창가 접시는 엎어져 있어 밑바닥만 보이고, 먼지가 하얗다. 안경을 한 번
      밀어 올리며 이쪽을 본다.
  talk:
    first:
      ko: >
        처음 보는 얼굴이군, 자네. 나는 청람이라네, 예전엔 이 서당에서 아이들을
        가르쳤지. 장터 신문 활자가 좀 이상하다는 소문이 있던데, 보부상 강포도
        며칠째 안 보인다더군. 눈에 띄는 게 있으면 적어 두게.
    second:
      ko: >
        또 왔군, 자네. 아까 말한 그 신문, 아직 생각나나. 활자가 어긋난 그 줄
        말일세. 강포 소식은 아직 없네. 만석상회 창고에 짐이 남아 있으니,
        자네 한번 살펴보게.
    when:
      - flag: ember
        ko: >
          우물길과 다방 문을 다시 보게, 자네. 그 쪽 공기가 조금 달라졌어.
          말은 아끼게.
      - flag: dawn_scent
        ko: >
          잉크 냄새가 옷에 배었군, 자네. 검문에서 그냥 지나왔다면, 새벽이
          오기 전에 움직이는 사람들이 자네를 한 번 더 볼 걸세. 말은 아끼게.
      - flag: first_market_sale
        ko: >
          창고 짐을 봤군, 자네. 그 봇짐은 강포가 두고 간 게 맞아, 골목 수레
          자국이 정거장 화물마당 쪽으로 이어질 걸세. 다방에도 물어보게.
          거긴 소문이 먼저 도착하니까.
      - flag: examined:gangpo-pack
        ko: >
          창고 짐을 봤군, 자네. 장터에 가서 시세를 한번 살펴보게. 쑥이든
          뭐든 넘겨 보면 골목 소문이 조금 더 또렷해질 걸세.
  foreshadow: [FS-001, FS-007, FS-016]

- id: clerk-oh
  name:
    ko: 오씨 점원
  room: dalbitgol:packing-shed
  aliases: [오씨, 점원]
  look:
    ko: >
      먹물 묻은 앞치마 자락이 무릎까지 내려와 있고, 손가락에 새끼줄 자국이
      빨갛다. 연필을 귀에 꽂은 채로 가마니 끈을 매며, 겨 냄새가 옷에서
      난다. 구두코가 진흙에 젖어 있다.
  talk:
    first:
      ko: >
        아, 손님? 여긴 만석상회 포장간이에요. 가마니 묶는 중이라 말은
        짧게 할게요. 새끼줄이 손바닥에 따갑고, 겨 냄새가 옷에 배요. 수레는
        저쪽 정거장으로 나가요.
    second:
      ko: >
        또 오셨어요? 가마니 끈이 자꾸 풀려서요. 나무 바퀴가 삐걱일 때마다
        겨가 눈 밑으로 떨어져요. 볼일 없으면 장터로 가세요.
    when:
      - flag: first_market_sale
        ko: >
          그 봇짐요, 강포 씨 거 맞아요. 새벽이 오기 전에 수레 끌고 정거장
          화물마당 쪽으로 나갔어요. 다방 백야 쪽에서도 찾더라. 거기도 한번
          물어봐요.
      - flag: examined:gangpo-pack
        ko: >
          그 봇짐 보셨어요? 장터에서 시세 한번 보고 쑥이라도 팔아 보세요.
          손님이 장터를 돌고 오면 말이 좀 달라져요.
  foreshadow: [FS-016]

- id: cafe-hand
  name:
    ko: 점원
  room: dalbitgol:cafe-baekya
  aliases: [점원, 손님]
  look:
    ko: >
      앞치마 끈이 느슨하고, 쟁반 위에 잔받침만 몇 개 놓여 있다. 보리차
      냄새가 소매에 배어 있고, 손가락 끝에 찻물이 식어 있다. 구두코가
      마루에 살짝 긁힌다.
  talk:
    first:
      ko: >
        어서 오세요. 보리차는 식기 전에 드세요. 창가 자리는 오늘은 손님이
        없네요.
    second:
      ko: >
        또 오셨어요? 잔은 아직 따뜻해요. 안쪽은 조용하고, 창밖 수레 소리만
        들려요.
    when:
      - flag: ember
        ko: >
          문 쪽을 한 번 더 보세요. 우물길 쪽으로 누가 자꾸 눈길을 줘요.
      - flag: dawn_scent
        ko: >
          카운터 뒤에서 누가 사라진 보부상 이야기를 하고 있어요. 점원이
          잔을 닦다 말고 고개를 끄덕여요. 그 말은 여기까지 들린다고, 작은
          목소리로.
      - flag: first_market_sale
        ko: >
          창가에서 누가 강포 수레 이야기를 하고 있어요. 점원이 잔받침을
          놓으며 한 번 듣더니, 고개만 끄덕여요.
  foreshadow: [FS-006, FS-016]
